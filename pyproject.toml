[project]
name = "alphagenome-encoder-ft"
version = "1.0.0"
description = "Encoder-only AlphaGenome fine-tuning for MPRA, with reporter-construct-aware inference."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alphagenome-pytorch @ git+https://github.com/genomicsxai/alphagenome-pytorch.git",
    "numpy",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# `uv sync` installs this package into the repo's own environment, so the scripts can import it.
[tool.uv]
package = true

# The alphagenome-pytorch commit this repo's uv.lock resolves to, the one docs/LoCon_EMA.md was
# run with. A uv source applies only inside this repo; packages that depend on this one are
# not pinned by it.
[tool.uv.sources]
alphagenome-pytorch = { git = "https://github.com/genomicsxai/alphagenome-pytorch.git", rev = "72268c011d37cf2d387506493614952d85abe21b" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Progress bars, run logging and evaluation plots. Each is imported behind a guard and
# the code degrades with a message when it is absent, so none of them belongs in the
# runtime dependencies above: scoring inserts from a checkpoint needs none of them.
[dependency-groups]
train = [
    "matplotlib>=3.10.8",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]
